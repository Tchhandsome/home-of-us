services:
  mysql:
    image: mysql:8.0
    container_name: home-of-us-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - home_of_us_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - home_of_us

  backend:
    image: ${BACKEND_IMAGE:-home-of-us-backend:latest}
    container_name: home-of-us-backend
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HOME_OF_US_DB_HOST: mysql
      HOME_OF_US_DB_PORT: 3306
      HOME_OF_US_DB_NAME: ${MYSQL_DATABASE}
      HOME_OF_US_DB_USERNAME: ${MYSQL_USER}
      HOME_OF_US_DB_PASSWORD: ${MYSQL_PASSWORD}
      HOME_OF_US_UPLOAD_ROOT: /app/data/uploads
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx512m}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - home_of_us

  web:
    image: ${WEB_IMAGE:-home-of-us-web:latest}
    container_name: home-of-us-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - home_of_us

volumes:
  home_of_us_mysql_data:

networks:
  home_of_us:
    driver: bridge
