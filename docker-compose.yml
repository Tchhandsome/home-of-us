services:
  mysql:
    image: mysql:8.0
    container_name: home-of-us-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: home_of_us_root
      MYSQL_DATABASE: home_of_us
      MYSQL_USER: home_of_us
      MYSQL_PASSWORD: home_of_us_dev
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - home_of_us_mysql_data:/var/lib/mysql

volumes:
  home_of_us_mysql_data:

